services:
  chatbot:
    image: colmex-chatbot:${RELEASE_ID:-1.0.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - chatbot-state:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  chatbot-state:
