# Add these locations INSIDE the EXISTING HTTPS repository server block.
# Preserve the existing Hyrax locations, TLS settings, and authentication.
# Replace REPLACE_PROXY_TOKEN with exactly the PROXY_TOKEN in .env.
location = /chatbot { return 308 /chatbot/; }
location /chatbot/ {
    proxy_pass http://127.0.0.1:8080; # No trailing slash: preserve /chatbot/ prefix.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Chatbot-Proxy-Token "REPLACE_PROXY_TOKEN";
    proxy_set_header X-Chatbot-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    client_max_body_size 64k;
}
# Probe health from the server itself; do not expose it externally.
location = /chatbot/health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Chatbot-Proxy-Token "REPLACE_PROXY_TOKEN";
}
